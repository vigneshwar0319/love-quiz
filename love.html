<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    text-align:center;
    overflow:hidden;
}

/* Floating background hearts */
#hearts-container{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    overflow:hidden;
    z-index:0;
}

.heart-bg{
    position:absolute;
    bottom:-50px;
    font-size:20px;
    animation: floatUp linear infinite;
    opacity:0.8;
}

@keyframes floatUp{
    0%{ transform: translateY(0); opacity:0.8; }
    100%{ transform: translateY(-110vh); opacity:0; }
}

.page{
    position:relative;
    z-index:1;
    height:100vh;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.active{ display:flex; }

/* Title */
.movie-title{
    font-size:70px;
    font-weight:900;
    text-transform:uppercase;
    text-shadow:0 0 20px #ff1a75;
}

/* Heart Enter Button */
.heart-btn{
    position:relative;
    width:150px;
    height:140px;
    background:#e60026;
    margin-top:70px;
    cursor:pointer;
    transform: rotate(-45deg);
    animation: heartbeat 1.2s infinite;
}

/* Top circles */
.heart-btn:before,
.heart-btn:after{
    content:"";
    position:absolute;
    width:150px;
    height:140px;
    background:#e60026;
    border-radius:50%;
    z-index:0; /* behind text */
}

.heart-btn:before{
    top:-75px;
    left:0;
}

.heart-btn:after{
    left:75px;
    top:0;
}

/* ❤️ TEXT FIX */
.heart-btn span{
    position:absolute;
    width:100%;
    text-align:center;
    top:30%;
    left:60%;
    transform:translate(-50%,-50%) rotate(45deg);
    font-weight:bold;
    font-size:16px;
    color:white;
    line-height:1.3;
    z-index:2; /* ABOVE everything */
}

@keyframes heartbeat{
    0%{ transform: rotate(-45deg) scale(1);}
    50%{ transform: rotate(-45deg) scale(1.1);}
    100%{ transform: rotate(-45deg) scale(1);}
}

button{
    padding:14px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

/* 💖 Page Title for Page 2+ */
.page-title{
    font-size:36px;
    font-weight:800;
    margin-bottom:25px;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff4da6,
        0 0 40px #ff1a75;
}

.sticker-img{
    width: 60px;
    height: 60px;
    object-fit: contain;
    pointer-events: none; /* VERY IMPORTANT */
}

.sticker-big{
    width: 120px;
    height: 120px;
    object-fit: contain;
    pointer-events: none;
}

#options{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}




.special{
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    position:relative;
    transition:none; /* REMOVE smooth slow movement */
}


/* ICE */
.ice{ background:#aee6ff !important; color:#003366 !important; }
.break{ animation: breakIce 1s forwards; }
@keyframes breakIce{
    100%{ transform:translateY(200px) rotate(45deg); opacity:0;}
}

/* BOMB */
.bomb{ background:black !important; color:yellow !important; animation:shake 0.4s infinite; }
.blast{ animation:explode 0.8s forwards; }
@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
    100%{transform:translateX(0);}
}
@keyframes explode{
    100%{ transform:scale(0); opacity:0;}
}

/* Smaller heart transform */
.heart-transform{
    width:80px;
    height:75px;
    background:#ff0033 !important;
    transform:rotate(-45deg);
    animation:heartbeat 1s infinite;
}
.heart-transform:before,
.heart-transform:after{
    content:"";
    position:absolute;
    width:80px;
    height:75px;
    background:#ff0033;
    border-radius:50%;
}
.heart-transform:before{ top:-40px; left:0; }
.heart-transform:after{ left:40px; top:0; }

/* Full screen hearts */
.full-heart{
    position:fixed;
    animation:floatEverywhere 4s linear forwards;
}
@keyframes floatEverywhere{
    0%{ transform:scale(0.5); opacity:1; }
    100%{ transform:translateY(100vh); opacity:0; }
}
</style>
</head>

<body>

<div id="hearts-container"></div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <div class="movie-title">Hi My Love ❤️</div>
    <div class="heart-btn" onclick="startQuiz()">
        <span>Enter Into<br>My Heart ❤️</span>
    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<div class="page-title">Hi Rithu❤️</div>
    <h2 id="questionText"></h2>
    <div id="options"></div>
</div>

<script>

/* Floating background hearts */
function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart-bg");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*5+5)+"s";
    document.getElementById("hearts-container").appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
}
setInterval(createHeart,400);

function startQuiz(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
    loadQuestion();
}

const questions = [
{
text:"Do you know how much love I have on you ? ❤️",
options:[
{text:"unaku thyriyathu",action:"ice"},
{text:"enakey thyriyathu",action:"bomb"},
{text:"rendu perukumey thyriyathu avlo loveeee",action:"love"}
]
},
{
text:"I know but asking ? 😌",
options:[
{text:"Love me ❤️",action:"loveAnswer"},
{text:"Hate me 😤",action:"runaway"}
]
},
{
text:"Will u be my valentine 💘",
options:[
{text:"Yes 💖",action:"finalYes"},
{text:"No 😏",action:"finalNo"}
]
}
];

let current=0;
let yesScale=1;

let noMessages = [
    "Really? 😳",
    "Are you sure? 😏",
    "Think again! 🤨",
    "Not even for chocolate? 🍫🥺",
    "Complimenting life choice 😌✨",
    "Dare to say yes 😈",
    "That was a typo right? 😏",
    "You clicked wrong I think 👀",
    "Try again… but correctly 😌",
    "Don’t break my heart 💔",
    "Pleaseee 🥺",
    "You know you want to 😏",
    "Say yes already 😭",
    "This button is broken anyway 😂",
    "Last chance before I cry 😢",
    "Okay I’m judging now 😒",
    "Still no? 😤",
    "You can’t escape"
];


let noClickCount = 0;


function loadQuestion(){
const q=questions[current];
document.getElementById("questionText").innerHTML=q.text;
const optDiv=document.getElementById("options");
optDiv.innerHTML="";

if(current === 2){
    optDiv.style.display = "flex";
    optDiv.style.flexDirection = "column";
    optDiv.style.alignItems = "center";
}


q.options.forEach(opt=>{
const btn=document.createElement("button");
btn.className="special";
btn.innerHTML=opt.text;

if(opt.action==="ice") btn.onclick=()=>iceEffect(btn);
else if(opt.action==="bomb") btn.onclick=()=>bombEffect(btn);
else if(opt.action==="love") btn.onclick=()=>loveEffect(btn);
else if(opt.action==="loveAnswer") btn.onclick=loveAnswer;
else if(opt.action==="runaway") btn.onmouseover=()=>runaway(btn);
else if(opt.action==="finalYes") btn.onclick=finalYes;
else if(opt.action==="finalNo") btn.onclick=()=>finalNo(btn);

optDiv.appendChild(btn);
});
}

function nextQuestion(){ current++; loadQuestion(); }

/* Effects */
function iceEffect(btn){
    showSticker(btn, "https://media1.tenor.com/m/jk5Gfl50hS4AAAAC/tom-y-jerry-jerry.gif");
}

function bombEffect(btn){
    showSticker(btn, "https://i.pinimg.com/originals/da/16/55/da16552300b0fca6f1b93916187ff1de.gif");
}

function showSticker(btn, stickerUrl){
    btn.disabled = true;        // disable only this button
    btn.innerHTML = "";         // remove text

    const img = document.createElement("img");
    img.src = stickerUrl;
    img.className = "sticker-img";

    btn.appendChild(img);

    // Remove the button after 2.5s
    setTimeout(()=>{
        btn.remove();
    }, 2500);
}


function loveEffect(btn){

    const optDiv = document.getElementById("options");

    // Remove other buttons immediately
    const allButtons = optDiv.querySelectorAll("button");
    allButtons.forEach(b => {
        if (b !== btn) {
            b.remove();
        }
    });

    // Disable clicked button & clear text
    btn.disabled = true;
    btn.innerHTML = "";

    // Show your GIF sticker
    const img = document.createElement("img");
    img.src = "https://media2.giphy.com/media/j9oQaOqdm7zdtKM7Vh/giphy.gif";
    img.className = "sticker-big";
    btn.appendChild(img);

    // After short delay → next question
    setTimeout(()=>{
        nextQuestion();
    }, 2500); // 2.5 seconds
}


function runaway(btn){

    const container = document.getElementById("page2");

    const maxX = container.clientWidth - btn.offsetWidth;
    const maxY = container.clientHeight - btn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    btn.style.position = "absolute";
    btn.style.left = randomX + "px";
    btn.style.top = randomY + "px";
}


function loveAnswer(){
document.getElementById("questionText").innerHTML=
"I know u can't stop loving me 😌💖✨😍";
document.getElementById("options").innerHTML="";
setTimeout(()=>nextQuestion(),3000);
}

function finalNo(btn){

    const buttons = document.querySelectorAll("#options button");
    const yesBtn = buttons[0];

    // Grow YES button naturally
    let currentFont = parseFloat(window.getComputedStyle(yesBtn).fontSize);
    yesBtn.style.fontSize = (currentFont + 4) + "px";

    let currentPadding = parseFloat(window.getComputedStyle(yesBtn).paddingTop);
    yesBtn.style.padding = (currentPadding + 4) + "px 30px";

    yesBtn.style.transition = "0.3s ease";

    // LOOP messages forever
    btn.innerHTML = noMessages[noClickCount % noMessages.length];
    noClickCount++;
}





function finalYes(){
document.getElementById("questionText").innerHTML=
"❤️💍 Happiiieee valentine day Chellameyyyy 💖✨😍";
document.getElementById("options").innerHTML="";
for(let i=0;i<200;i++) createBigHeart();
}

function createBigHeart(){
const heart=document.createElement("div");
heart.innerHTML="❤️";
heart.classList.add("full-heart");
heart.style.left=Math.random()*100+"vw";
heart.style.top=Math.random()*100+"vh";
heart.style.fontSize=(Math.random()*30+20)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}

</script>
</body>
</html>
